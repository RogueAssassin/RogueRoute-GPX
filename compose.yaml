name: rogueroute-gpx

# One container runs everything: the website, osrm-routed and the region supervisor.
# Region switches restart osrm-routed inside the container; nothing needs the engine socket.
services:
  rogueroute-gpx:
    image: ${ROGUEROUTE_IMAGE:-ghcr.io/rogueassassin/rogueroute-gpx}:${ROGUEROUTE_TAG:-13.0.0}
    container_name: rogueroute-gpx
    restart: unless-stopped
    stop_grace_period: 30s
    # Runs as your account so map files stay yours. Rootless Podman runs as container root
    # instead (compose.podman.yaml), which is your host account in its user namespace.
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/gpx-web/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      ROGUEROUTE_DATA_DIR: /data
      OSRM_REGION: ${OSRM_ACTIVE_REGION:-australia}
      NEXT_PUBLIC_APP_VERSION: v${ROGUEROUTE_VERSION:-13.0.0}
    ports:
      # Set HOST_BIND=127.0.0.1 when a reverse proxy on the same host is the only client.
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-9080}:9080"
    volumes:
      - type: bind
        source: ${OSRM_DATA_DIR:-/mnt/h/osrm}
        target: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # rogueroute-gpx is the network Rogue Dashboard joins; rogueroute-gpx-web keeps the v12
    # hostname its cards already probe. Both networks are created by ./rogueroute-gpx.
    networks:
      rogueroute-gpx:
        aliases:
          - rogueroute-gpx-web
      media-net:
        aliases:
          - rogueroute-gpx-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      rogue.dashboard.service: "rogueroute-gpx"
      rogue.dashboard.monitor-url: "http://rogueroute-gpx:9080/api/health/osrm"

networks:
  rogueroute-gpx:
    external: true
    name: rogueroute-gpx
  media-net:
    external: true
    name: ${MEDIA_NETWORK:-media-net}
