name: Validate

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate release surfaces and shell syntax
        run: |
          bash scripts/version.sh check
          bash -n install.sh rogueroute rogueroute-gpx scripts/version.sh
          test -x rogueroute-gpx && test -x rogueroute && test -x install.sh
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker network create media-net >/dev/null
          docker network create rogueroute-gpx >/dev/null
          docker compose --env-file .env -f compose.yaml config -q
          docker compose --env-file .env -f compose.yaml -f compose.podman.yaml config -q
          ROGUEROUTE_MEMORY_CAP=4g docker compose --env-file .env -f compose.yaml -f compose.memory.yaml config -q

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/rogueassassin/rogueroute-gpx:ci
          cache-from: type=gha
      - name: Start through compose with two tiny test regions
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/osrm"; mkdir -p "$data"
          cat > "$RUNNER_TEMP/regions.json" <<'JSON'
          { "regions": [
            { "key": "andorra", "label": "Andorra", "group": "test", "graph": "andorra", "url": "https://download.openstreetmap.fr/extracts/europe/andorra-latest.osm.pbf", "download": "small", "expanded": "small", "bounds": [[1.40, 42.42, 1.80, 42.66]] },
            { "key": "san-marino", "label": "San Marino", "group": "test", "graph": "san-marino", "url": "https://download.openstreetmap.fr/extracts/europe/san_marino-latest.osm.pbf", "download": "small", "expanded": "small", "bounds": [[12.40, 43.89, 12.52, 43.99]] },
            { "key": "big-test", "label": "Big test", "group": "test", "graph": "big-test", "url": "https://download.openstreetmap.fr/extracts/europe/does-not-exist.osm.pbf", "download": "100GB", "expanded": "300GB", "bounds": [[0.0, 0.0, 0.1, 0.1]] }
          ] }
          JSON
          cp .env.example .env
          sed -i "s|^OSRM_DATA_DIR=.*|OSRM_DATA_DIR=$data|; s|^ROGUEROUTE_TAG=.*|ROGUEROUTE_TAG=ci|; s|^PUID=.*|PUID=$(id -u)|; s|^PGID=.*|PGID=$(id -g)|; s|^OSRM_ACTIVE_REGION=.*|OSRM_ACTIVE_REGION=andorra|; s|^OSRM_SWITCH_COOLDOWN_SECONDS=.*|OSRM_SWITCH_COOLDOWN_SECONDS=0|; s|^HOST_PORT=.*|HOST_PORT=19080|" .env
          cat > "$RUNNER_TEMP/ci.yaml" <<YAML
          services:
            rogueroute-gpx:
              volumes:
                - type: bind
                  source: $RUNNER_TEMP/regions.json
                  target: /app/regions.json
                  read_only: true
          YAML
          docker network create media-net >/dev/null
          docker network create rogueroute-gpx >/dev/null
          # Cap the container like ./rogueroute-gpx does, at a size CI can check.
          export ROGUEROUTE_MEMORY_CAP=6g
          docker compose --env-file .env -f compose.yaml -f compose.memory.yaml -f "$RUNNER_TEMP/ci.yaml" up -d
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:19080/api/health && break; sleep 1; done
          echo
          curl -fsS http://127.0.0.1:19080/api/health | jq -e '.osrm.state == "no-graph"'
          test "$(docker exec rogueroute-gpx id -u)" = "$(id -u)"
          # The memory cap reaches the cgroup and the supervisor; map tools run at idle disk priority.
          test "$(docker exec rogueroute-gpx cat /sys/fs/cgroup/memory.max)" = $((6 * 1024 * 1024 * 1024))
          docker exec rogueroute-gpx node -e "fetch('http://127.0.0.1:9080/api/maps').then(r=>r.json()).then(j=>{console.log(j.limits);process.exit(j.limits?.capped?0:1)})"
          docker exec rogueroute-gpx rogueroute-gpx osm status | tee /tmp/status.txt
          grep -q "capped at 6.4 GB" /tmp/status.txt && grep -q "disk priority idle" /tmp/status.txt
          # A region estimated to need more memory than the cap allows is refused before downloading.
          if docker exec rogueroute-gpx rogueroute-gpx osm add big-test > /tmp/big.txt 2>&1; then cat /tmp/big.txt; exit 1; fi
          cat /tmp/big.txt; grep -q "needs about" /tmp/big.txt
          test ! -e "$data/big-test-latest.osm.pbf.part"
          curl -fsS http://127.0.0.1:19080/ >/dev/null
      - name: Download and prepare inside the container
        shell: bash
        run: |
          set -euo pipefail
          # Test maps come from the openstreetmap.fr mirror: Geofabrik refuses connections from
          # GitHub runners at times. Diagnostics only, from the runner and the container:
          curl -sSI --max-time 20 https://download.openstreetmap.fr/extracts/europe/andorra-latest.osm.pbf | head -1 || true
          docker exec rogueroute-gpx node -e 'fetch("https://download.openstreetmap.fr/extracts/europe/andorra-latest.osm.pbf",{method:"HEAD"}).then(r=>console.log("container HEAD",r.status),e=>console.log("container HEAD failed",e.cause??e))' || true
          # One command queues download and preparation; --wait blocks until both are done.
          docker exec rogueroute-gpx rogueroute-gpx osm add andorra san-marino --wait
          docker exec rogueroute-gpx rogueroute-gpx osm status
          docker exec rogueroute-gpx rogueroute-gpx osm queue
          test -s "$RUNNER_TEMP/osrm/.rogueroute-gpx/queue.json"
          curl -fsS http://127.0.0.1:19080/api/maps | jq -e '[.regions[] | select(.state == "prepared")] | length == 2'
          curl -fsS http://127.0.0.1:19080/maps | grep -q "Map status"
          # The downloader page and its API answer even when Geofabrik refuses the runner.
          curl -fsS http://127.0.0.1:19080/maps/download | grep -q "Add map regions"
          curl -fsS http://127.0.0.1:19080/api/geofabrik | jq -e '(.regions | type == "array") and (.prepared | type == "array")'
          # The first prepared region is loaded automatically when nothing was served.
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19080/api/health/osrm >/dev/null 2>&1 && break; sleep 1
          done
          curl -fsS http://127.0.0.1:19080/api/health/osrm | jq -e '.ok and .activeRegion == "andorra"'
          test -s "$RUNNER_TEMP/osrm/.rogueroute-gpx/state.json"
      - name: Route with automatic region switching
        shell: bash
        run: |
          set -euo pipefail
          route() {
            curl -fsS -X POST http://127.0.0.1:19080/api/generate -H 'content-type: application/json' \
              -d "$(jq -n --arg input "$1" '{input: $input, routeMode: "preserve-order"}')"
          }
          route $'42.5063,1.5218,A\n42.5078,1.5211,B' | tee /tmp/andorra.json | jq -e '.region.key == "andorra" and .region.switched == false and (.gpx | contains("<trk"))' >/dev/null
          route $'43.9356,12.4473,A\n43.9367,12.4485,B' | tee /tmp/san-marino.json | jq -e '.region.key == "san-marino" and .region.switched == true and (.gpx | contains("<trk"))' >/dev/null
          curl -fsS http://127.0.0.1:19080/api/regions | jq -e '.activeRegion == "san-marino" and .osrm.state == "ready"'
          # Waypoints outside every prepared region get a clear error instead of a switch.
          code=$(curl -s -o /tmp/outside.json -w '%{http_code}' -X POST http://127.0.0.1:19080/api/generate \
            -H 'content-type: application/json' -d '{"input":"-37.8136,144.9631\n-37.8160,144.9690"}')
          test "$code" = 400 && jq -e '.error | test("not inside any")' /tmp/outside.json
          # Admin endpoints are closed without ADMIN_TOKEN.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19080/api/admin/queue)" = 401
      - name: Graceful stop
        if: always()
        shell: bash
        run: |
          docker logs rogueroute-gpx 2>&1 | tail -80
          start=$(date +%s)
          docker stop -t 30 rogueroute-gpx
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop took ${elapsed}s"
          test "$elapsed" -lt 20
