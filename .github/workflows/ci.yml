name: Validate

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate release surfaces and shell syntax
        run: |
          bash scripts/version.sh check
          bash -n install.sh rogueroute rogueroute-gpx scripts/version.sh
          test -x rogueroute-gpx && test -x rogueroute && test -x install.sh
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker network create media-net >/dev/null
          docker network create rogueroute-gpx >/dev/null
          docker compose --env-file .env -f compose.yaml config -q
          docker compose --env-file .env -f compose.yaml -f compose.podman.yaml config -q

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/rogueassassin/rogueroute-gpx:ci
          cache-from: type=gha
      - name: Start through compose with two tiny test regions
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/osrm"; mkdir -p "$data"
          cat > "$RUNNER_TEMP/regions.json" <<'JSON'
          { "regions": [
            { "key": "andorra", "label": "Andorra", "group": "test", "graph": "andorra", "url": "https://download.geofabrik.de/europe/andorra-latest.osm.pbf", "download": "small", "expanded": "small", "bounds": [[1.40, 42.42, 1.80, 42.66]] },
            { "key": "liechtenstein", "label": "Liechtenstein", "group": "test", "graph": "liechtenstein", "url": "https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf", "download": "small", "expanded": "small", "bounds": [[9.47, 47.04, 9.64, 47.28]] }
          ] }
          JSON
          cp .env.example .env
          sed -i "s|^OSRM_DATA_DIR=.*|OSRM_DATA_DIR=$data|; s|^ROGUEROUTE_TAG=.*|ROGUEROUTE_TAG=ci|; s|^PUID=.*|PUID=$(id -u)|; s|^PGID=.*|PGID=$(id -g)|; s|^OSRM_ACTIVE_REGION=.*|OSRM_ACTIVE_REGION=andorra|; s|^OSRM_SWITCH_COOLDOWN_SECONDS=.*|OSRM_SWITCH_COOLDOWN_SECONDS=0|; s|^HOST_PORT=.*|HOST_PORT=19080|" .env
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
          cat > "$RUNNER_TEMP/ci.yaml" <<YAML
          services:
            rogueroute-gpx:
              volumes:
                - type: bind
                  source: $RUNNER_TEMP/regions.json
                  target: /app/regions.json
                  read_only: true
          YAML
          docker network create media-net >/dev/null
          docker network create rogueroute-gpx >/dev/null
          docker compose --env-file .env -f compose.yaml -f "$RUNNER_TEMP/ci.yaml" up -d
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:19080/api/health && break; sleep 1; done
          echo
          curl -fsS http://127.0.0.1:19080/api/health | jq -e '.osrm.state == "no-graph"'
          test "$(docker exec rogueroute-gpx id -u)" = "$(id -u)"
          curl -fsS http://127.0.0.1:19080/ >/dev/null
      - name: Download and prepare inside the container
        shell: bash
        run: |
          set -euo pipefail
          docker exec rogueroute-gpx rogueroute-gpx osm download andorra liechtenstein
          docker exec rogueroute-gpx rogueroute-gpx osm prepare andorra liechtenstein
          docker exec rogueroute-gpx rogueroute-gpx osm status
          # The first prepared region is loaded automatically when nothing was served.
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19080/api/health/osrm >/dev/null 2>&1 && break; sleep 1
          done
          curl -fsS http://127.0.0.1:19080/api/health/osrm | jq -e '.ok and .activeRegion == "andorra"'
          test -s "$RUNNER_TEMP/osrm/.rogueroute-gpx/state.json"
      - name: Route with automatic region switching
        shell: bash
        run: |
          set -euo pipefail
          route() {
            curl -fsS -X POST http://127.0.0.1:19080/api/generate -H 'content-type: application/json' \
              -d "$(jq -n --arg input "$1" '{input: $input, routeMode: "preserve-order"}')"
          }
          route $'42.5063,1.5218,A\n42.5078,1.5211,B' | tee /tmp/andorra.json | jq -e '.region.key == "andorra" and .region.switched == false and (.gpx | contains("<trk"))' >/dev/null
          route $'47.1410,9.5209,A\n47.1395,9.5230,B' | tee /tmp/liechtenstein.json | jq -e '.region.key == "liechtenstein" and .region.switched == true and (.gpx | contains("<trk"))' >/dev/null
          curl -fsS http://127.0.0.1:19080/api/regions | jq -e '.activeRegion == "liechtenstein" and .osrm.state == "ready"'
          # Waypoints outside every prepared region get a clear error instead of a switch.
          code=$(curl -s -o /tmp/outside.json -w '%{http_code}' -X POST http://127.0.0.1:19080/api/generate \
            -H 'content-type: application/json' -d '{"input":"-37.8136,144.9631\n-37.8160,144.9690"}')
          test "$code" = 400 && jq -e '.error | test("not inside any")' /tmp/outside.json
          # Admin endpoints are closed without ADMIN_TOKEN.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19080/api/admin/jobs)" = 401
      - name: Graceful stop
        if: always()
        shell: bash
        run: |
          docker logs rogueroute-gpx 2>&1 | tail -80
          start=$(date +%s)
          docker stop -t 30 rogueroute-gpx
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop took ${elapsed}s"
          test "$elapsed" -lt 20
